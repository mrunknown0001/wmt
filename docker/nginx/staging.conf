server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # TLS is terminated by Cloudflare; the tunnel delivers plain HTTP here.
    # Nothing on the host publishes this port to the LAN — cloudflared reaches
    # it over the compose network / loopback only.

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 68m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- websockets (soketi, Pusher protocol) -----------------------------
    # The Pusher client connects to /app/{key}. Only that prefix is proxied;
    # the publish API (/apps/{id}/events, authenticated by the app secret) stays
    # private on the compose network where the application reaches it directly.
    location ^~ /app/ {
        set $upstream_ws soketi:6001;
        proxy_pass http://$upstream_ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Cloudflare gives up at 100s, so there is no point waiting longer.
        fastcgi_read_timeout 100;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
