; Runtime PHP settings for the staging image.

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 68M
max_execution_time = 100

expose_php = Off

; OPcache on, with validation off: the code is immutable in the image, so there
; is nothing to revalidate — a change means a rebuild, not an edit in place.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
