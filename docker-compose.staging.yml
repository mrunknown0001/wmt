name: wmt-staging

# Staging stack for the internal VM (10.10.0.101), reached at
# https://wmt-dev.bfcgroup.ph over the host's shared Cloudflare Tunnel.
#
# cloudflared already runs on the VM as a systemd service with a file-based
# config at /etc/cloudflared/config.yml, shared with the other hostnames
# (bl / snipe / purchasing). This stack does NOT run its own tunnel. nginx
# publishes on loopback only and the host's cloudflared proxies to it. Add this
# ingress rule above the final `- service: http_status:404` (needs sudo):
#
#   - hostname: wmt-dev.bfcgroup.ph
#     service: http://127.0.0.1:9081
#
# 9081 is used because 8000 (snipe) and 9080 (purchasing) are already taken.
#
#   deploy:  ./deploy-staging.sh
#   logs:    docker compose -f docker-compose.staging.yml logs -f
#   console: docker compose -f docker-compose.staging.yml exec app php artisan ...

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile.staging
    args:
      # Must match the owner of .env on the host, or the container cannot read
      # it. Set automatically by ./deploy-staging.sh.
      UID: "${HOST_UID:-1000}"
      GID: "${HOST_GID:-1000}"
      # Compile-time only (see the assets stage). Change any of these and you
      # must rebuild, not just restart.
      VITE_APP_NAME: "${APP_NAME:-WMT}"
      VITE_PUSHER_APP_KEY: "${PUSHER_APP_KEY}"
      VITE_PUSHER_HOST: "${PUBLIC_HOSTNAME}"
      VITE_PUSHER_PORT: "443"
      VITE_PUSHER_SCHEME: "https"
  image: wmt/php:staging
  volumes:
    # Only mutable state is mounted; application code lives in the image.
    - ./.env:/var/www/html/.env:ro
    - storage-app:/var/www/html/storage/app
    - logs:/var/www/html/storage/logs
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *php

  nginx:
    image: nginx:1.27-alpine
    ports:
      # Loopback only — reachable by cloudflared on this host, by nothing on
      # the LAN. 9081 avoids snipe (8000) and purchasing (9080).
      - "127.0.0.1:${HTTP_PORT:-9081}:80"
    volumes:
      - ./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
    depends_on:
      - app
    restart: unless-stopped

  # Built assets are baked into the PHP image; this copies them into a shared
  # volume so nginx serves them without a second build. Runs as root because a
  # fresh named volume is owned by root:root and www-data cannot write into it;
  # modes are normalised afterwards so nginx can read everything.
  assets:
    <<: *php
    user: "0:0"
    entrypoint: []
    command: sh -c "cp -R /var/www/html/public/. /shared/ && chmod -R a+rX /shared && echo 'assets published'"
    volumes:
      - public:/shared
    depends_on: []
    restart: "no"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # queue:work, not listen — the image is immutable so there is nothing to
  # reload, and work is faster. --max-time recycles the worker hourly to bound
  # memory; restart brings it back.
  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600 --timeout=300

  scheduler:
    <<: *php
    command: php artisan schedule:work

  # WMT's websockets speak the Pusher protocol; soketi is the server. nginx
  # proxies /app/ to it (see staging.conf), so the browser reaches it over the
  # tunnel as wss://wmt-dev.bfcgroup.ph/app/{key}.
  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    environment:
      SOKETI_DEFAULT_APP_ID: "${PUSHER_APP_ID}"
      SOKETI_DEFAULT_APP_KEY: "${PUSHER_APP_KEY}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET}"
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"
    restart: unless-stopped

volumes:
  mysqldata:
  redisdata:
  storage-app:
  logs:
  public:
