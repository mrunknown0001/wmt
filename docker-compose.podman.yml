name: wmt-podman

# Local stack for rootless Podman.
#
#   podman-compose -f docker-compose.podman.yml up -d --build
#   podman-compose -f docker-compose.podman.yml exec app php artisan migrate --seed
#   open http://localhost:8080          (admin@wmt.com / password)
#
# Built from docker/php/Dockerfile.staging, which bakes vendor/ and the compiled
# assets into the image. The dev stack (docker-compose.yml) cannot be used here:
# it builds out of ./vendor/laravel/sail, which only exists after a host-side
# composer install.
#
# Differences from docker-compose.staging.yml, all forced by running rootless
# and locally rather than on the VM behind cloudflared:
#
#   * Config arrives through env_file as real environment variables instead of a
#     mounted .env. A rootless container maps host UID 1000 to container UID 0,
#     so a host-owned .env is not readable by the www-data the image runs as.
#   * nginx publishes on 0.0.0.0:8080. Rootless cannot bind below 1024, and
#     there is no tunnel in front of it here.
#   * Images are fully qualified. Podman has no implicit Docker Hub default.

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile.staging
    args:
      UID: "1000"
      GID: "1000"
      # Compile-time only — Vite bakes these into the bundle. The browser reaches
      # soketi through nginx on the published port, so this is the host origin,
      # not the internal service name.
      VITE_APP_NAME: "WMT"
      VITE_PUSHER_APP_KEY: "wmtkey"
      VITE_PUSHER_HOST: "localhost"
      VITE_PUSHER_PORT: "8080"
      VITE_PUSHER_SCHEME: "http"
  image: localhost/wmt/php:podman
  env_file: .env.podman
  volumes:
    - storage-app:/var/www/html/storage/app
    - logs:/var/www/html/storage/logs
  depends_on:
    - mysql
    - redis
  restart: unless-stopped

services:
  app:
    <<: *php

  nginx:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/podman.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
    # No depends_on deliberately. podman-compose turns it into --requires, and a
    # two-level chain (nginx -> app -> mysql/redis) trips a dependency-graph bug
    # in 1.0.6 that leaves nginx stuck in Created. Nothing is lost: staging.conf
    # passes both upstreams through variables, so nginx resolves app and soketi
    # per request rather than at startup and simply 502s until they answer.
    restart: unless-stopped

  # Copies the baked assets into a volume nginx can read. Runs as root because a
  # fresh named volume is owned by root and www-data cannot write into it.
  assets:
    <<: *php
    user: "0:0"
    entrypoint: []
    command: sh -c "cp -R /var/www/html/public/. /shared/ && chmod -R a+rX /shared && echo 'assets published'"
    volumes:
      - public:/shared
    depends_on: []
    restart: "no"

  mysql:
    image: docker.io/library/mysql:8.0
    env_file: .env.podman
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-wmt}"
      MYSQL_USER: "${DB_USERNAME:-wmt}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
    ports:
      - "13306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  queue:
    <<: *php
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600 --timeout=300

  scheduler:
    <<: *php
    command: php artisan schedule:work

  # Pusher-protocol websocket server. nginx proxies /app/ to it, so the browser
  # dials ws://localhost:8080/app/wmtkey.
  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    environment:
      SOKETI_DEFAULT_APP_ID: "wmt"
      SOKETI_DEFAULT_APP_KEY: "wmtkey"
      SOKETI_DEFAULT_APP_SECRET: "wmtsecret"
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"
    restart: unless-stopped

volumes:
  mysqldata:
  redisdata:
  storage-app:
  logs:
  public:
